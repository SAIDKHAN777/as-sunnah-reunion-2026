<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="100%" height="100%" fill="none">
  <!-- Ribbon S-Emblem with Negative Space Arrow -->
  <g transform="translate(20, 0)">
    <!-- Top Purple Swirl -->
    <path
      d="M 180 15 
         C 220 15 255 35 255 75 
         C 255 102 238 122 215 132 
         L 190 98 
         L 204 88 
         C 212 82 218 74 218 64 
         C 218 48 200 38 180 40 
         C 162 42 148 54 145 70 
         C 142 50 155 25 180 15 Z"
      fill="url(#purple-grad)"
    />

    <!-- Bottom Orange Swirl -->
    <path
      d="M 220 185 
         C 180 185 145 165 145 125 
         C 145 98 162 78 185 68 
         L 210 102 
         L 196 112 
         C 188 118 182 126 182 136 
         C 182 152 200 162 220 160 
         C 238 158 252 146 255 130 
         C 258 150 245 175 220 185 Z"
      fill="url(#orange-grad)"
    />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B2A9E" />
      <stop offset="100%" stop-color="#7B42B8" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2780C" />
      <stop offset="100%" stop-color="#F28C1E" />
    </linearGradient>
  </defs>

  <!-- Typography matching reference -->
  <text
    x="220"
    y="235"
    font-family="'Playfair Display', Georgia, serif"
    font-size="38"
    font-weight="700"
    fill="#3B1A6E"
    text-anchor="middle"
    letter-spacing="5"
  >
    AS-SUNNAH
  </text>

  <text
    x="220"
    y="265"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="14.5"
    font-weight="700"
    fill="#E2780C"
    text-anchor="middle"
    letter-spacing="3.2"
  >
    SKILL DEVELOPMENT INSTITUTE
  </text>
</svg>
